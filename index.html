<title>InstaShopz</title>
<style>
:root{--bg:#000;--text:#fff;--accent:#a855f7;--surface:#0f0f0f;--surface2:#1a1a1a;--line:#262626;--muted:#8e8e8e;--on-accent:#fff;--accent-soft:rgba(168,85,247,.16);--bg-a:rgba(0,0,0,.86);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--rail:244px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased}
html.lock,html.lock body{overflow:hidden}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;padding-bottom:calc(66px + var(--safe-b))}
body.onboard{padding-bottom:0}
body.onboard .tabbar,body.onboard .topbar{display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;font-weight:600}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=color]{padding:3px;width:48px;height:44px;flex:0 0 48px;cursor:pointer}
input[type=checkbox]{width:auto}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:28px}
p{margin:0}
.muted{color:var(--muted)}
.acc{color:var(--accent)}
.hidden{display:none!important}
.shell{max-width:935px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;background:var(--bg-a);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.brand{font-size:24px;font-weight:800;letter-spacing:-.03em}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px;position:relative}
.icon-btn:hover{background:var(--surface)}
.icon-btn.on{color:var(--accent)}
.dotb{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bg-a);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 0 calc(6px + var(--safe-b))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;position:relative}
.tab.on{color:var(--text)}
.tab.on svg{stroke:var(--accent);stroke-width:2.4}
.tab .dotb{top:2px;right:calc(50% - 18px)}
.rail-brand{display:none}

.brand,.rail-brand{display:flex;align-items:center;gap:8px}
.brand .bagmark,.rail-brand .bagmark{width:24px;height:26px;color:var(--accent)}
@media (min-width:1024px){
  body{padding-bottom:0;padding-left:var(--rail)}
  .tabbar{top:0;right:auto;width:var(--rail);flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:26px 12px;gap:6px}
  .tab{flex:0 0 auto;flex-direction:row;gap:16px;font-size:16px;padding:12px 14px;border-radius:12px;width:100%}
  .tab:hover{background:var(--surface)}
  .tab .dotb{top:10px;right:auto;left:30px}
  .rail-brand{display:flex;font-size:26px;font-weight:800;letter-spacing:-.03em;padding:4px 14px 22px}
  .topbar .brand{visibility:hidden}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.outline{background:transparent;border:1px solid var(--line)}
.btn.danger{color:#ff4d6d}
.btn.block{width:100%;padding:14px;font-size:16px;border-radius:12px}
.link{color:var(--accent);font-weight:700}
.page{padding:8px 16px 30px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.page-head p{margin-top:4px;font-size:14px}

/* onboarding */
.onboard-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:calc(30px + var(--safe-t)) 24px calc(30px + var(--safe-b))}
.logo-big{width:84px;height:84px;border-radius:24px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 18px 50px var(--accent-soft)}
.onboard-wrap h1{font-size:40px;margin-bottom:6px}
.onboard-wrap .sub{font-size:17px;margin-bottom:34px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 26px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--text)}
.ob-or{text-align:center;margin-top:18px;font-size:14px}

/* search & chips */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search input{border:0;background:transparent;padding:11px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:700}
.chip.on{background:var(--accent);color:var(--on-accent)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto;vertical-align:middle}
.list-tools{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;font-size:13px}
.list-tools select{width:auto;padding:7px 32px 7px 12px;font-size:13px;border-radius:999px}

/* item rows */
.irow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.thumb{width:58px;height:58px;border-radius:12px;overflow:hidden;background:var(--surface2);flex:0 0 58px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imeta{flex:1;min-width:0}
.imeta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.imeta .sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty-inline{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.qty-inline button{width:32px;height:34px;font-size:18px;font-weight:800}
.qty-inline button:hover{background:var(--surface2)}
.qty-inline input{width:46px;border:0;border-radius:0;padding:6px 0;text-align:center;font-size:15px;background:transparent;-moz-appearance:textfield}
.qty-inline.low{border-color:#ff9f43}.qty-inline.out{border-color:#ff4d6d}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{width:76px;height:76px;border-radius:50%;border:2px solid var(--text);color:var(--text);display:grid;place-items:center;margin:0 auto 16px}
.empty h3{color:var(--text);margin-bottom:6px}
.empty .btn{margin-top:18px}

/* storefront profile */
.shopbar{margin:6px 16px 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);display:flex;justify-content:space-between;align-items:center;font-size:14px}
.profile{display:flex;align-items:center;gap:22px;padding:14px 16px 6px}
.avatar{width:86px;height:86px;border-radius:50%;padding:3px;background:conic-gradient(var(--accent),var(--text),var(--accent));flex:0 0 86px}
.avatar>div{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);background:var(--surface2);overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:800}
.avatar img{width:100%;height:100%;object-fit:cover}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:19px;font-weight:800}
.stats span{font-size:13px;color:var(--muted)}
.bio{padding:6px 16px 0}
.bio h2{font-size:17px}
.bio p{font-size:14px;margin-top:4px;white-space:pre-wrap;font-weight:500;opacity:.9}
.profile-actions{display:flex;gap:8px;padding:14px 16px 4px}
.profile-actions .btn{flex:1}
@media (min-width:700px){.profile{gap:60px;padding:28px 40px 10px}.avatar{width:130px;height:130px;flex-basis:130px}.avatar>div{font-size:50px}.stats{justify-content:flex-start;gap:44px}.bio,.profile-actions{padding-left:40px;padding-right:40px}.profile-actions .btn{flex:0 0 auto}}

/* highlights */
.highlights{display:flex;gap:16px;overflow-x:auto;padding:16px 16px 6px;scrollbar-width:none}
.highlights::-webkit-scrollbar{display:none}
.hl{flex:0 0 auto;width:70px;text-align:center;font-size:12px;font-weight:700}
.hl .c{width:66px;height:66px;border-radius:50%;padding:2px;border:1px solid var(--line);margin:0 auto 6px}
.hl .c>div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--surface2);display:grid;place-items:center}
.hl .c img{width:100%;height:100%;object-fit:cover}
.hl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sections & cards */
.sec{margin-top:20px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.sec-head h3{font-size:19px;display:flex;align-items:center;gap:8px}
.sec-head .count{font-size:13px;color:var(--muted);font-weight:700}
.sec-head .dot{width:14px;height:14px}
.row-wrap{position:relative}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:0 16px 6px;scrollbar-width:none}
.arrow{position:absolute;top:calc(50% - 40px);width:38px;height:38px;border-radius:50%;background:var(--bg-a);border:1px solid var(--line);display:none;place-items:center;z-index:2}
.arrow.l{left:6px}.arrow.r{right:6px}
@media (hover:hover) and (pointer:fine){.row-wrap:hover .arrow{display:grid}}
.card{flex:0 0 auto;width:152px;scroll-snap-align:start;text-align:left}
.card .img{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface2);position:relative}
.card .img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .img img{transform:scale(1.04)}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:40px;font-weight:800;background:linear-gradient(135deg,var(--surface2),var(--accent-soft));color:var(--muted)}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px}
.sold{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.cmeta{padding:8px 2px 0}
.cname{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-weight:800;font-size:15px}
.orig{color:var(--muted);text-decoration:line-through;font-weight:600;margin-left:6px;font-size:.88em}
.feat .card{width:min(80vw,400px)}
@media (min-width:1024px){.feat .card{width:320px}}
.feat .card .img{aspect-ratio:4/5;border-radius:22px}
.feat-info{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.feat-info b{display:block;font-size:20px;font-weight:800;margin-bottom:2px}
.feat-info .price{font-size:17px}
.feat-info .orig{color:rgba(255,255,255,.7)}
.sec-empty{margin:0 16px;padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;font-size:14px}
.add-collection{display:block;margin:28px auto 10px;padding:14px 22px;color:var(--accent);font-weight:800;font-size:16px}
@media (min-width:700px){.card{width:190px}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px}
.grid .card{width:auto}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.overlay.open{opacity:1}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;width:100%;max-width:640px;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:22px 22px 0 0;transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(18px + var(--safe-b));position:relative}
.overlay.open .sheet{transform:none}
@media (min-width:700px){.overlay{align-items:center;padding:20px}.sheet{border-radius:22px;border-bottom:1px solid var(--line);max-height:90vh;padding-bottom:18px}}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:17px}
.sheet-head>:first-child{justify-self:start;font-weight:600}
.sheet-head>:last-child{justify-self:end}
.sheet-body{padding:16px}
.x-float{position:absolute;top:12px;right:12px;z-index:4;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.actions-list button{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;font-size:16px;border-bottom:1px solid var(--line);text-align:left}
.actions-list button:last-child{border-bottom:0}
.actions-list .danger{color:#ff4d6d}
.confirm{padding:26px 20px 6px;text-align:center}
.confirm h3{margin-bottom:8px}
.confirm p{color:var(--muted);font-weight:500;margin-bottom:22px}
.confirm .btns{display:flex;gap:10px}
.confirm .btns .btn{flex:1;padding:13px}

/* detail */
.gal-wrap{position:relative;background:var(--surface)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:0 0 100%;aspect-ratio:1;scroll-snap-align:center;object-fit:cover;width:100%}
.gdots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.gdots i.on{background:#fff}
.gal-arrow{position:absolute;top:calc(50% - 19px);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.gal-arrow.l{left:10px}.gal-arrow.r{right:10px}
.detail{padding:18px 16px 4px}
.detail h2{font-size:24px}
.dprice{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dprice .price{font-size:24px;color:var(--accent)}
.dprice .orig{font-size:17px}
.save-pill{background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.desc{margin-top:14px;font-weight:500;line-height:1.5;white-space:pre-wrap;opacity:.92}
.stock{margin-top:14px;font-size:14px;color:var(--muted)}
.stock.low{color:#ff9f43}.stock.out{color:#ff4d6d}
.private{margin-top:14px;padding:12px;border-radius:12px;background:var(--surface);font-size:13px;color:var(--muted);font-weight:500}
.private b{color:var(--text)}
.detail .btn.block{margin-top:16px}
.recs{margin-top:26px}

/* form */
.fld{display:block;margin:0 0 16px}
.fld>span,.lbl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
.lbl small,.fld>span small{text-transform:none;letter-spacing:0;font-weight:600}
.priv{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.disc-prev{margin:-6px 0 16px;font-size:14px;min-height:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.ptile{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:var(--surface)}
.ptile img{width:100%;height:100%;object-fit:cover}
.ptile .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.ptile .cover{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:800;background:var(--accent);color:var(--on-accent);padding:3px 7px;border-radius:999px}
.padd{border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer;background:transparent}
.padd:hover{border-color:var(--accent);color:var(--accent)}
.tagsel{display:flex;gap:10px;align-items:center}
.tagsel .swatch{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);flex:0 0 44px}
.tagnew{display:flex;gap:8px;margin-top:8px}
.tagnew .btn{padding:0 16px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.qty button{width:58px;height:54px;font-size:24px;font-weight:800;color:var(--accent)}
.qty button:hover{background:var(--surface2)}
.qty input{border:0;border-radius:0;text-align:center;font-size:22px;font-weight:800;background:transparent;-moz-appearance:textfield}
.tally{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--accent);min-height:22px;font-size:13px;font-weight:800;flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pick-list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.pick{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick .thumb{width:44px;height:44px;flex-basis:44px;border-radius:10px}
.pick input{accent-color:var(--accent);width:20px;height:20px}
.pick span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* settings */
.set-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--surface);margin-bottom:18px}
.set-card .avatar{width:58px;height:58px;flex-basis:58px}
.set-card .avatar>div{font-size:22px;border-width:2px}
.set-list{border-radius:16px;background:var(--surface);overflow:hidden;margin-bottom:18px}
.set-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:16px}
.set-row:last-child{border-bottom:0}
.set-row .ico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 34px}
.set-row .t{flex:1}
.set-row .t small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.set-row .chev{color:var(--muted)}
.sp-head{display:flex;align-items:center;gap:6px;margin:4px 0 18px}
.sp-head h1{font-size:24px;flex:1}
.group-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 10px}
.color-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.color-row:last-child{border-bottom:0}
.color-row .t{flex:1}
.color-row input[type=text]{width:110px;padding:9px 10px;font-size:14px;text-transform:uppercase}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preset{border-radius:14px;padding:12px;border:2px solid var(--line);text-align:left;font-size:13px;font-weight:800}
.preset.on{border-color:var(--accent)}
.preset .pv{display:flex;gap:4px;margin-top:8px}
.preset .pv i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
.switch{position:relative;width:50px;height:30px;flex:0 0 50px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--surface2);border:1px solid var(--line);transition:.2s}
.switch i::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.switch input:checked+i{background:var(--accent);border-color:var(--accent)}
.switch input:checked+i::after{left:22px}
.tag-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tag-row:last-child{border-bottom:0}
.tag-row input[type=text]{flex:1;padding:9px 12px}
.tag-row input[type=color]{width:40px;height:40px;flex-basis:40px}
.tag-row .n{font-size:12px;color:var(--muted);min-width:44px;text-align:right}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat-grid div{background:var(--surface);border-radius:14px;padding:14px}
.stat-grid b{display:block;font-size:20px}
.stat-grid span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);font-weight:500;line-height:1.5;padding:4px 4px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.file-status{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--surface);margin-bottom:14px;font-size:14px}
.file-status .st{width:10px;height:10px;border-radius:50%;background:#2ecc71;flex:0 0 10px}
.file-status .st.dirty{background:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:1024px){#toast{bottom:30px;margin-left:calc(var(--rail)/2)}}
</style>

<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num=v=>{if(v===''||v==null)return'';const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)?'':Math.round(n*100)/100};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isTouch=()=>matchMedia('(pointer:coarse)').matches;

const ICONS={
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 store:'<path d="M3 9l1.6-5h14.8L21 9M3 9v11h18V9M3 9h18M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M9.5 20v-5h5v5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 plusSq:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
 eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
 chevR:'<path d="M9 18l6-6-6-6"/>',chevL:'<path d="M15 18l-6-6 6-6"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
 palette:'<circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.75 1.5-1.5 0-.4-.15-.74-.4-1-.26-.27-.4-.62-.4-1 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9z"/>',
 tag:'<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><path d="M7 7h.01"/>',
 db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
 camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
 save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
 bag:'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 up:'<path d="M18 15l-6-6-6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',
 layers:'<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>'
};
const ic=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ================= storage (IndexedDB w/ localStorage fallback) ================= */
const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('instashopz',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 get(k){if(!this.db){try{const v=localStorage.getItem('isz_'+k);return Promise.resolve(v?JSON.parse(v):undefined)}catch(e){return Promise.resolve()}}
  return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()}catch(e){res()}})},
 set(k,v){if(!this.db){try{localStorage.setItem('isz_'+k,JSON.stringify(v))}catch(e){toast('Device storage is full — export your store')}return Promise.resolve()}
  return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>{toast('Could not save — device storage full?');res()}}catch(e){res()}})},
 del(k){if(!this.db){try{localStorage.removeItem('isz_'+k)}catch(e){}return Promise.resolve()}
  return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
};

function hexToRgb(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function lum(h){const[r,g,b]=hexToRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
const rgba=(h,a)=>{const[r,g,b]=hexToRgb(h);return`rgba(${r},${g},${b},${a})`};
function applyTheme(t){const r=document.documentElement.style;
 r.setProperty('--bg',t.bg);r.setProperty('--text',t.text);r.setProperty('--accent',t.accent);
 r.setProperty('--surface',mix(t.bg,t.text,.06));r.setProperty('--surface2',mix(t.bg,t.text,.11));r.setProperty('--line',mix(t.bg,t.text,.17));
 r.setProperty('--muted',mix(t.text,t.bg,.45));r.setProperty('--on-accent',lum(t.accent)>.42?'#000000':'#ffffff');
 r.setProperty('--accent-soft',rgba(t.accent,.18));r.setProperty('--bg-a',rgba(t.bg,.86));
 document.documentElement.style.colorScheme=lum(t.bg)>.5?'light':'dark';
 $('meta[name=theme-color]').setAttribute('content',t.bg)}

function tallySVG(n){n=Math.max(0,parseInt(n)||0);const show=Math.min(n,40);let s='',x=0;const g=Math.floor(show/5),rem=show%5;
 for(let k=0;k<g;k++){for(let j=0;j<4;j++)s+=`<line x1="${x+j*5+2}" y1="2" x2="${x+j*5+2}" y2="20"/>`;s+=`<line x1="${x-1}" y1="17" x2="${x+20}" y2="5"/>`;x+=28}
 for(let j=0;j<rem;j++)s+=`<line x1="${x+j*5+2}" y1="2" x2="${x+j*5+2}" y2="20"/>`;
 const w=Math.max(4,x+rem*5+2);
 return(n?`<svg width="${w}" height="22" viewBox="0 0 ${w} 22" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">${s}</svg>`:'<span class="muted">No stock</span>')+(n>40?`<span>+${n-40} more</span>`:'')+(n?`<span class="muted">${n} in stock</span>`:'')}

function itemsFor(s){let a=S.items;switch(s.type){

const fileName=()=>(S.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'store')+'-instashopz.json';
function markSaved(name){meta.dirty=false;meta.lastSaved=Date.now();if(name)meta.fileName=name;flush();updateBadge();if(ui.tab==='settings')render()}
async function saveToFile(forceNew){if(!S)return;flush();
 const json=JSON.stringify({app:'InstaShopz',version:1,exportedAt:new Date().toISOString(),store:S});const name=fileName();
 if(window.showSaveFilePicker&&!isIOS()){try{
   let h=forceNew?null:await DB.get('fileHandle');if(h&&!h.createWritable)h=null;
   if(h){let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')h=null}
   if(!h){h=await showSaveFilePicker({suggestedName:name,types:[{description:'InstaShopz store',accept:{'application/json':['.json']}}]});await DB.set('fileHandle',h)}
   const w=await h.createWritable();await w.write(json);await w.close();markSaved(h.name);toast(`Saved — ${h.name} updated`);return}
  catch(e){if(e.name==='AbortError')return;console.warn(e)}}
 const file=new File([json],name,{type:'application/json'});
 if(isTouch()&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});markSaved(name);toast('Store file ready');return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);markSaved(name);toast('Downloaded '+name)}

  if(!st||!Array.isArray(st.items))throw new Error('bad');
  if(S&&!await confirmBox('Import store?',`This replaces "${S.name}" with "${st.name||'imported store'}" (${st.items.length} items). Save your current store first if you want to keep it.`,'Import',false))return;
  S=normalize(st);applyTheme(S.theme);meta={dirty:false,lastSaved:Date.now(),fileName:file.name};await DB.del('fileHandle');flush();ui.tab='home';ui.sp='';ui.shop=false;render();toast(`Imported ${S.name}`)}
 catch(e){toast("That file isn't an InstaShopz store")}}

/* ================= events ================= */
const ACT={
 tab:b=>{ui.tab=b.dataset.tab;if(ui.tab!=='settings')ui.sp='';try{localStorage.setItem('isz_tab',ui.tab)}catch(e){}render();scrollTo(0,0)},
 close:b=>closeSheet(b.closest('.overlay')),
 'ob-accent':b=>{ui.obAccent=b.dataset.c;applyTheme({...DEFAULT_THEME,accent:ui.obAccent});$$('.sw').forEach(s=>s.classList.toggle('on',s===b))},
 'ob-create':()=>{const n=$('#obName').value.trim();if(!n){toast("What's your store called?");$('#obName').focus();return}
  S=newStore(n,ui.obAccent);meta={dirty:true,lastSaved:0,fileName:''};ui.tab='home';applyTheme(S.theme);flush();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render();toast(`Welcome to ${n}!`)},
 import:()=>$('#importFile').click(),
 'add-item':()=>openItemForm(),
 'edit-item':b=>{const d=b.closest('.detail-sheet');if(d)closeSheet(d.closest('.overlay'));openItemForm(b.dataset.id)},
 'view-item':b=>openItem(b.dataset.id),
 'save-item':b=>saveItem(!!b.dataset.editing),
 'delete-item':async b=>{const i=itemById(b.dataset.id);if(!i)return;if(!await confirmBox('Delete item?',`"${i.name}" will be removed from your store.`,'Delete'))return;
  S.items=S.items.filter(x=>x.id!==i.id);[S.featured,...S.sections].forEach(s=>{if(s.items)s.items=s.items.filter(id=>id!==i.id)});persist();
  $$('.overlay').forEach(o=>closeSheet(o));render();toast('Item deleted')},
 fqty:b=>{const inp=$('#itemForm [name=qty]');inp.value=Math.max(0,(parseInt(inp.value)||0)+(+b.dataset.d));updTally()},
 qty:b=>{const i=itemById(b.dataset.id);if(!i)return;i.qty=Math.max(0,(+i.qty||0)+(+b.dataset.d));persist();const w=b.parentElement;$('input',w).value=i.qty;w.className=`qty-inline ${i.qty<=0?'out':i.qty<=3?'low':''}`;
  const h=$('.page-head p');if(h)h.textContent=`${S.items.length} item${S.items.length===1?'':'s'} · ${S.items.reduce((a,x)=>a+(+x.qty||0),0)} in inventory`},
 filter:b=>{ui.filter=b.dataset.v;render()},
 'photo-rm':b=>{draft.images.splice(+b.dataset.n,1);renderPhotos()},
 'photo-cover':b=>{const n=+b.dataset.n;const [x]=draft.images.splice(n,1);draft.images.unshift(x);renderPhotos()},
 'tag-create':b=>{const box=b.closest('.tagbox'),kind=b.dataset.kind;const inp=$('.tagnew input[type=text]',box),hex=$('.tagnew input[type=color]',box);
  const t=createTag(kind,inp.value,hex&&hex.value);if(!t){toast('Type a name');inp.focus();return}
  refreshTagSelect(box,kind,t.id);$('.tagnew',box).classList.add('hidden');inp.value='';const sel=$('select',box);if(sel.dataset.ch==='col-ref')colDraft.refId=t.id;toast(`${kind==='color'?'Color':'Category'} "${t.name}" created`)},
 'toggle-shop':()=>{ui.shop=!ui.shop;ui.tab='home';render();scrollTo(0,0)},
 'scroll-row':b=>{const h=$('.hscroll',b.parentElement);h.scrollBy({left:(+b.dataset.d)*h.clientWidth*.8,behavior:'smooth'})},
 gal:b=>{const g=$('.gal',b.parentElement);g.scrollBy({left:(+b.dataset.d)*g.clientWidth,behavior:'smooth'})},
 'add-collection':()=>openCollectionForm(),
 'edit-collection':b=>openCollectionForm(b.dataset.id),
 'sec-menu':b=>secMenu(b.dataset.id),
 'col-type':b=>{colDraft.type=b.dataset.t;colDraft.refId='';$('#colBody').innerHTML=colBody(colDraft.id==='featured')},
 'save-collection':b=>saveCollection(!!b.dataset.new),
 'open-cat':b=>openCategory(b.dataset.id),
 'new-cat':()=>newCategorySheet(),
 'nc-save':b=>{const t=createTag('category',$('#ncName').value);if(!t){toast('Type a name');return}closeSheet(b.closest('.overlay'));render();toast(`Category "${t.name}" created`)},
 sp:b=>{ui.tab='settings';ui.sp=b.dataset.p;render();scrollTo(0,0)},
 'save-file':()=>saveToFile(false),
 'save-file-new':()=>saveToFile(true),
 'clear-store':async()=>{if(!await confirmBox('Clear store?',`Everything in "${S.name}" will be erased from this device. Save a JSON copy first if you want to keep it.`,'Clear store'))return;
  S=null;meta={dirty:false,lastSaved:0,fileName:''};await DB.del('store');await DB.del('meta');await DB.del('fileHandle');ui.sp='';ui.tab='home';applyTheme(DEFAULT_THEME);render();toast('Store cleared')},
 preset:b=>{const p=PRESETS[+b.dataset.n];S.theme={bg:p.bg,text:p.text,accent:p.accent};applyTheme(S.theme);persist();render()},
 'theme-reset':()=>{S.theme={...DEFAULT_THEME};applyTheme(S.theme);persist();render()},
 'avatar-rm':()=>{S.avatar='';persist();render()},
 'tag-add':b=>{const row=b.closest('.tag-row');const t=createTag(b.dataset.kind,$('input[type=text]',row).value,($('input[type=color]',row)||{}).value);if(!t){toast('Type a name');return}render()},
 'tag-del':async b=>{const kind=b.dataset.kind,id=b.dataset.id;const list=kind==='color'?'colors':'categories';const t=S[list].find(x=>x.id===id);
  if(!await confirmBox(`Delete ${kind}?`,`"${t.name}" will be removed from all items and any collections using it.`,'Delete'))return;
  S[list]=S[list].filter(x=>x.id!==id);S.items.forEach(i=>{if(kind==='color'&&i.colorId===id)i.colorId='';if(kind==='category'&&i.categoryId===id)i.categoryId=''});
  S.sections=S.sections.filter(s=>!(s.type===kind&&s.refId===id));if(S.featured.type===kind&&S.featured.refId===id)S.featured={id:'featured',type:'all',refId:'',title:'Featured',items:[]};
  persist();render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const stop=e.target.closest('[data-stop]');
 if(stop&&b.contains(stop)&&b!==stop)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});

const CH={
 sort:t=>{ui.sort=t.value;$('#itemsList').innerHTML=renderItemsList()},
 'qty-set':t=>{const i=itemById(t.dataset.id);if(!i)return;i.qty=Math.max(0,parseInt(t.value)||0);t.value=i.qty;persist();t.parentElement.className=`qty-inline ${i.qty<=0?'out':i.qty<=3?'low':''}`},
 'photo-add':async t=>{const files=[...t.files].slice(0,3-draft.images.length);for(const f of files){try{draft.images.push(await compressImage(f))}catch(e){toast("Couldn't read that image")}}renderPhotos()},
 'col-pick':t=>{const s=new Set(colDraft.items);t.checked?s.add(t.value):s.delete(t.value);colDraft.items=S.items.map(i=>i.id).filter(id=>s.has(id));const l=t.closest('.sheet-body').querySelector('.lbl small');if(l)l.textContent=`${colDraft.items.length} selected`},
 'col-ref':t=>{if(t.value!=='__new')colDraft.refId=t.value;const inp=$('[data-in=col-title]');if(inp&&t.value!=='__new')inp.placeholder=secTitle({...colDraft,title:''})},
 avatar:async t=>{const f=t.files[0];if(!f)return;try{S.avatar=await compressImage(f,400,.85);persist();render()}catch(e){toast("Couldn't read that image")}},
 field:t=>{S.fields[t.dataset.k]=t.checked;persist();render()},
 showStock:t=>{S.showStock=t.checked;persist()},
 'theme-hex':t=>{let v=t.value.trim();if(!v.startsWith('#'))v='#'+v;if(!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)){toast('Use a hex color like #A855F7');return}if(v.length===4)v='#'+v.slice(1).split('').map(c=>c+c).join('');S.theme[t.dataset.k]=v.toLowerCase();applyTheme(S.theme);persist();render()},
 'tag-hex':t=>{const c=colById(t.dataset.id);if(c){c.hex=t.value;persist()}},
 'tag-rename':t=>{const list=t.dataset.kind==='color'?S.colors:S.categories;const x=list.find(y=>y.id===t.dataset.id);const v=t.value.trim();if(x&&v){x.name=v;persist()}else t.value=x.name}
};
document.addEventListener('change',e=>{const t=e.target;
 if(t.matches('.tag-select')){const box=t.closest('.tagbox');const nw=$('.tagnew',box);
  if(t.value==='__new'){nw.classList.remove('hidden');t.value='';$('input[type=text]',nw).focus()}else nw.classList.add('hidden');updateSwatch(box)}
 const k=t.dataset&&t.dataset.ch;if(k&&CH[k])CH[k](t)});
let searchT;
const IN={
 search:t=>{ui.q=t.value;clearTimeout(searchT);searchT=setTimeout(()=>{$('#itemsList').innerHTML=renderItemsList()},120)},
 'col-title':t=>{colDraft.title=t.value},
 profile:t=>{S[t.dataset.k]=t.dataset.k==='name'?(t.value.trim()||'My Store'):t.value;persist()},
 theme:t=>{S.theme[t.dataset.k]=t.value;applyTheme(S.theme);const h=t.parentElement.querySelector('input[type=text]');if(h)h.value=t.value;persist()}
};
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&IN[k])IN[k](e.target)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){const o=$('#modal-root').lastElementChild;if(o)closeSheet(o)}
 if(e.key==='Enter'&&e.target.id==='obName')ACT['ob-create']();
 if(e.key==='Enter'&&e.target.id==='ncName')ACT['nc-save'](e.target);
 if(e.key==='Enter'&&e.target.closest&&e.target.closest('.tagnew')){e.preventDefault();e.target.closest('.tagnew').querySelector('[data-act=tag-create]').click()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&S){e.preventDefault();saveToFile(false)}});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)});
$$('[data-ico]').forEach(s=>s.outerHTML=ic(s.dataset.ico,26));

/* ================= boot ================= */
(async function boot(){
 await DB.open();
 const st=await DB.get('store');meta=(await DB.get('meta'))||meta;
 try{const t=localStorage.getItem('isz_tab');if(t)ui.tab=t}catch(e){}
 if(st){S=normalize(st);applyTheme(S.theme)}else applyTheme(DEFAULT_THEME);
 render();
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
